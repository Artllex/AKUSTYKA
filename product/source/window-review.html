<!doctype html><html lang="pl"><meta charset="utf-8"><title>Okno — kontrola prześwitu</title>
<style>body{margin:0;background:#172430;color:white;font:18px Arial}p{margin:12px}canvas{display:block;width:100%;height:auto}</style>
<p>Widok przez obie szyby od zewnętrznej strony wnęki</p>
<script type="module">
import * as THREE from 'three';
import {createRoom} from './src/room-view.js';
import {createRoomFeatureViews,defaultRoomFeatures} from './src/room-features.js';
const room={width:2.477,length:3.715,height:2.605},features=defaultRoomFeatures(room);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x172430);
scene.add(new THREE.AmbientLight(0xffffff,2.4));
const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(1,3,-2);scene.add(key);
scene.add(createRoom(room,features).group);
scene.add(createRoomFeatureViews(room,features).find(view=>view.group.name==='window').group);
for(const [x,y,color] of [[features.window.center-.25,1.55,0xe74e51],[features.window.center+.25,.55,0x49d0aa]]){
 const marker=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,.25),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.4}));
 marker.position.set(x,y,.35);scene.add(marker);
}
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(900,740);renderer.outputColorSpace=THREE.SRGBColorSpace;
const camera=new THREE.OrthographicCamera(-.88,.88,.72,-.72,.01,10);camera.position.set(features.window.center,1.1,-3);camera.lookAt(features.window.center,1.1,0);renderer.render(scene,camera);
document.body.append(renderer.domElement);
</script></html>
