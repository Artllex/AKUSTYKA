<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Millenium SD-180 B · kontrola modelu</title><style>
body{margin:0;background:#202428;color:#edf0f2;font:15px system-ui}header{display:flex;align-items:center;gap:20px;padding:12px 20px;background:#14181b}h1{font-size:17px;margin:0}button{padding:8px 13px;background:#30383d;border:1px solid #536068;border-radius:5px;color:inherit;cursor:pointer}button:hover{background:#41505a}nav{display:flex;gap:6px;flex-wrap:wrap}#canvas{height:calc(100vh - 64px)}canvas{display:block}small{color:#a8b4bb}
</style></head><body><header><h1>Millenium SD-180 B StudioDesk</h1><nav><button data-view="front">Przód</button><button data-view="rear">Tył</button><button data-view="top">Góra</button><button data-view="left">Lewy bok</button><button data-view="right">Prawy bok</button><button data-view="perspective">Perspektywa</button></nav><small>180 × 102 × 93 cm</small></header><div id="canvas"></div><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {createMilleniumDeskRecord} from './src/millenium-desk-model.js';import {createMilleniumDeskView} from './src/millenium-desk-view.js';
const host=document.getElementById('canvas'),scene=new THREE.Scene();scene.background=new THREE.Color(0xe4e6e7);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;host.appendChild(renderer.domElement);
const record=createMilleniumDeskRecord({width:1.8,length:2,height:2});record.position={x:0,y:0,z:0};const desk=createMilleniumDeskView(record);scene.add(desk.group);
scene.add(new THREE.HemisphereLight(0xffffff,0xa0a2a5,2.1));const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.position.set(-2,4,3);scene.add(sun);
const camera=new THREE.OrthographicCamera(-1.2,1.2,1,-1,.01,20),controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.46,0);controls.enableDamping=true;
const positions={front:[0,.46,3],rear:[0,.46,-3],top:[0,3,.001],left:[-3,.46,0],right:[3,.46,0],perspective:[2.4,2,2.9]};
function view(name){camera.position.set(...positions[name]);camera.up.set(0,1,0);if(name==='top')camera.up.set(0,0,-1);controls.update();}for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>view(button.dataset.view);view('perspective');
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.left=-1.18*w/h;camera.right=1.18*w/h;camera.top=1.18;camera.bottom=-1.18;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(host);resize();function draw(){requestAnimationFrame(draw);controls.update();renderer.render(scene,camera);}draw();
</script></body></html>
