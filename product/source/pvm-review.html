<!doctype html><html lang="pl"><meta charset="utf-8"><title>Sony PVM-20M2E · kontrola modelu</title>
<style>body{margin:0;padding:24px;background:#e8e9e8;color:#172027;font:16px system-ui}h1{margin:0 0 8px}p{margin:0 0 18px}.views{display:flex;gap:14px}figure{margin:0;flex:1;background:#f8f9f8;border:1px solid #bfc5c6;border-radius:8px;overflow:hidden}canvas{width:100%;height:560px;display:block}figcaption{padding:12px;text-align:center;font-weight:700}</style>
<h1>Sony PVM-20M2E</h1><p>Korpus 450 × 458 × 503 mm · widoki kontrolne modelu 3D</p><div class="views"><figure><div id="front"></div><figcaption>Przód</figcaption></figure><figure><div id="side"></div><figcaption>Bok</figcaption></figure><figure><div id="rear"></div><figcaption>Tył</figcaption></figure></div>
<script type="module">
import * as THREE from 'three';
import {createPvm20m2eView} from './src/pvm-20m2e-view.js';
const poses={front:[0,.29,-1.30],side:[1.13,.34,-.76],rear:[0,.29,1.30]};
for(const [name,position] of Object.entries(poses)){
 const node=document.getElementById(name),scene=new THREE.Scene();scene.background=new THREE.Color(0xf8f9f8);
 const {group}=createPvm20m2eView({id:'review',position:{x:0,y:0,z:0},yaw:0},{mount:false});scene.add(group);
 scene.add(new THREE.HemisphereLight(0xffffff,0x87939c,2.7));
 const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(-.8,1.5,-1.4);scene.add(key);
 const fill=new THREE.DirectionalLight(0xffffff,1.7);fill.position.set(.8,.8,1.5);scene.add(fill);
 const camera=new THREE.PerspectiveCamera(34,1,.01,10);camera.position.set(...position);camera.lookAt(0,.235,0);
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));node.append(renderer.domElement);
 const fit=()=>{const rect=node.getBoundingClientRect();renderer.setSize(rect.width,560);camera.aspect=rect.width/560;camera.updateProjectionMatrix();renderer.render(scene,camera);};new ResizeObserver(fit).observe(node);fit();
}
</script></html>
